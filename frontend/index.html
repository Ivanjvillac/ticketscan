<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0E1A" />
    <meta name="description" content="Escáner inteligente de tickets de compra" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TicketScan" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>TicketScan</title>
    <style>
      @media print {
        .sidebar, .main-nav, .actions, .btn-ghost, .del-btn { display: none !important; }
        .main { overflow: visible !important; }
        body { background: white !important; color: black !important; }
        .meta-card, .chart-box, .detail-list, .totals-block, .store-card, .items-table { border-color: #ccc !important; background: white !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
